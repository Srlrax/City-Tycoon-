<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a25">
  <meta name="description" content="Build a city from the ground up in City Tycoon.">
  <title>City Tycoon</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game-shell">
    <div id="world" aria-label="3D City Tycoon game world"></div>
    <div id="ui"></div>
    <div id="boot-screen"><div class="boot-mark">CT</div><div class="boot-title">CITY TYCOON</div><div class="boot-subtitle">PREPARING YOUR CITY</div><div class="boot-track"><span></span></div></div>
  </main>
  <script>
    // This fallback still works if the browser cannot start the module entry point.
    window.setTimeout(() => {
      const boot = document.getElementById('boot-screen');
      if (!boot || boot.dataset.gameStarted === 'true') return;
      boot.innerHTML = '<div class="boot-mark">CT</div><div class="boot-title">THE GAME SCRIPT DID NOT START</div><div class="boot-subtitle">CHECK THE PAGE CONNECTION, THEN RELOAD</div><button onclick="location.reload()" style="margin-top:22px;padding:11px 18px;border:0;border-radius:9px;background:#79dfae;color:#12352c;font-weight:800;cursor:pointer">RELOAD GAME</button>';
    }, 16000);
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
